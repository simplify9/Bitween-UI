server {
  listen 8080;
  server_tokens off;

  # Security headers on the page the browser loads (see finding #4).
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Permitted-Cross-Domain-Policies "none" always;
  # allow-popups so the Microsoft SSO login popup can still post back to the app.
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

  # Content-Security-Policy (finding #3 scoped work). Enforced after a clean
  # whole-site report-only run: the two eval/CDN offenders were removed (Monaco
  # editor self-hosted via CodeMirror, JSON viewer swapped to react-json-view-lite),
  # leaving zero violations. 'unsafe-inline' on style-src is required by Tailwind/React
  # inline styles; there is no 'unsafe-eval'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://login.microsoftonline.com; frame-src https://login.microsoftonline.com; font-src 'self' data:; form-action 'self' https://login.microsoftonline.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  location / {
    root   /usr/share/nginx/html;
    index  index.html index.htm;
    try_files $uri $uri/ /index.html;
  }
  error_page   500 502 503 504  /50x.html;

  location = /50x.html {
    root   /usr/share/nginx/html;
  }
}